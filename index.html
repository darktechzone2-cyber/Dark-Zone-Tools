<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131a">
  <title>Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #24304b 0%, #10131a 45%, #07090d 100%);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .calculator {
      width: min(100%, 370px);
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      background: rgba(18, 22, 30, 0.92);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(15px);
    }

    .display {
      min-height: 130px;
      margin-bottom: 18px;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .history {
      width: 100%;
      min-height: 24px;
      margin-bottom: 10px;
      color: #9299a8;
      font-size: 1rem;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result {
      width: 100%;
      color: #ffffff;
      font-size: clamp(2.5rem, 10vw, 4rem);
      font-weight: 700;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .result::-webkit-scrollbar {
      display: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      min-height: 68px;
      border: 0;
      border-radius: 18px;
      background: #242a35;
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      filter: brightness(1.18);
    }

    button:active {
      transform: scale(0.94);
    }

    button:focus-visible {
      outline: 3px solid rgba(78, 169, 255, 0.55);
      outline-offset: 2px;
    }

    .utility {
      background: #3d4553;
      color: #f4f6fa;
    }

    .operator {
      background: #ff9f0a;
      color: #ffffff;
      font-size: 1.7rem;
    }

    .equals {
      background: linear-gradient(135deg, #0b8cff, #0062ff);
    }

    .zero {
      grid-column: span 2;
    }

    .brand {
      margin-top: 17px;
      color: #687080;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 400px) {
      .calculator {
        padding: 15px;
      }

      button {
        min-height: 60px;
        border-radius: 15px;
      }

      .buttons {
        gap: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="calculator" aria-label="Calculator">
    <section class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="result" id="result">0</div>
    </section>

    <section class="buttons">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="sign">±</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-operator="/">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="*">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="-">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="operator" data-operator="+">+</button>

      <button class="zero" data-number="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>

    <div class="brand">Dark Tech Zone</div>
  </main>

  <script>
    const resultDisplay = document.getElementById("result");
    const historyDisplay = document.getElementById("history");
    const buttons = document.querySelector(".buttons");

    let currentValue = "0";
    let firstOperand = null;
    let currentOperator = null;
    let waitingForOperand = false;
    let hasError = false;

    const operatorSymbols = {
      "+": "+",
      "-": "−",
      "*": "×",
      "/": "÷"
    };

    function updateDisplay() {
      resultDisplay.textContent = currentValue;
      resultDisplay.scrollLeft = resultDisplay.scrollWidth;
    }

    function clearCalculator() {
      currentValue = "0";
      firstOperand = null;
      currentOperator = null;
      waitingForOperand = false;
      hasError = false;
      historyDisplay.textContent = "";
      updateDisplay();
    }

    function showError(message = "Error") {
      currentValue = message;
      firstOperand = null;
      currentOperator = null;
      waitingForOperand = true;
      hasError = true;
      historyDisplay.textContent = "";
      updateDisplay();
    }

    function formatNumber(number) {
      if (!Number.isFinite(number)) return "Error";

      const rounded = Number.parseFloat(number.toPrecision(12));
      return Object.is(rounded, -0) ? "0" : String(rounded);
    }

    function inputNumber(number) {
      if (hasError) clearCalculator();

      if (waitingForOperand) {
        currentValue = number;
        waitingForOperand = false;
      } else {
        currentValue = currentValue === "0"
          ? number
          : currentValue + number;
      }

      updateDisplay();
    }

    function inputDecimal() {
      if (hasError) clearCalculator();

      if (waitingForOperand) {
        currentValue = "0.";
        waitingForOperand = false;
      } else if (!currentValue.includes(".")) {
        currentValue += ".";
      }

      updateDisplay();
    }

    function calculate(first, second, operator) {
      switch (operator) {
        case "+":
          return first + second;
        case "-":
          return first - second;
        case "*":
          return first * second;
        case "/":
          return second === 0 ? null : first / second;
        default:
          return second;
      }
    }

    function chooseOperator(nextOperator) {
      if (hasError) return;

      const inputValue = Number(currentValue);

      if (currentOperator && waitingForOperand) {
        currentOperator = nextOperator;
        historyDisplay.textContent =
          `${formatNumber(firstOperand)} ${operatorSymbols[nextOperator]}`;
        return;
      }

      if (firstOperand === null) {
        firstOperand = inputValue;
      } else if (currentOperator) {
        const calculatedValue = calculate(
          firstOperand,
          inputValue,
          currentOperator
        );

        if (calculatedValue === null) {
          showError("Cannot divide by 0");
          return;
        }

        currentValue = formatNumber(calculatedValue);
        firstOperand = calculatedValue;
        updateDisplay();
      }

      currentOperator = nextOperator;
      waitingForOperand = true;
      historyDisplay.textContent =
        `${formatNumber(firstOperand)} ${operatorSymbols[nextOperator]}`;
    }

    function calculateResult() {
      if (
        hasError ||
        currentOperator === null ||
        firstOperand === null ||
        waitingForOperand
      ) {
        return;
      }

      const secondOperand = Number(currentValue);
      const expression =
        `${formatNumber(firstOperand)} ` +
        `${operatorSymbols[currentOperator]} ` +
        `${formatNumber(secondOperand)} =`;

      const calculatedValue = calculate(
        firstOperand,
        secondOperand,
        currentOperator
      );

      if (calculatedValue === null) {
        showError("Cannot divide by 0");
        return;
      }

      currentValue = formatNumber(calculatedValue);
      firstOperand = null;
      currentOperator = null;
      waitingForOperand = true;
      historyDisplay.textContent = expression;
      updateDisplay();
    }

    function toggleSign() {
      if (hasError || currentValue === "0") return;

      currentValue = String(Number(currentValue) * -1);
      updateDisplay();
    }

    function applyPercent() {
      if (hasError) return;

      currentValue = formatNumber(Number(currentValue) / 100);
      updateDisplay();
    }

    function backspace() {
      if (hasError) {
        clearCalculator();
        return;
      }

      if (waitingForOperand) return;

      currentValue =
        currentValue.length > 1
          ? currentValue.slice(0, -1)
          : "0";

      if (currentValue === "-") currentValue = "0";
      updateDisplay();
    }

    buttons.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.number !== undefined) {
        inputNumber(button.dataset.number);
        return;
      }

      if (button.dataset.operator) {
        chooseOperator(button.dataset.operator);
        return;
      }

      switch (button.dataset.action) {
        case "clear":
          clearCalculator();
          break;
        case "decimal":
          inputDecimal();
          break;
        case "equals":
          calculateResult();
          break;
        case "sign":
          toggleSign();
          break;
        case "percent":
          applyPercent();
          break;
      }
    });

    document.addEventListener("keydown", (event) => {
      const key = event.key;

      if (/^[0-9]$/.test(key)) {
        inputNumber(key);
      } else if (["+", "-", "*", "/"].includes(key)) {
        chooseOperator(key);
      } else if (key === ".") {
        inputDecimal();
      } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculateResult();
      } else if (key === "Escape") {
        clearCalculator();
      } else if (key === "Backspace") {
        backspace();
      } else if (key === "%") {
        applyPercent();
      }
    });
  </script>
</body>
</html>
